[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meam5170-planar-pushing"
version = "0.4.0"
description = "Contact-driven MuJoCo execution environment for MEAM 5170 planar pushing"
requires-python = ">=3.10"
dependencies = ["mujoco==3.17.0", "numpy==2.2.6", "matplotlib==3.10.9", "scipy==1.15.3", "osqp==1.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1"]

[project.scripts]
planar-pushing-demo = "planar_pushing.demo:main"
planar-pushing-validate = "planar_pushing.validate_model:main"
planar-pushing-mpc = "planar_pushing.mpc_demo:main"
planar-pushing-rule = "planar_pushing.rule_demo:main"
planar-pushing-motion = "planar_pushing.motion_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planar_pushing = ["models/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
